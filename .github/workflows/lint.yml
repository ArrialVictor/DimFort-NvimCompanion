name: lint

# Runs on every push/PR to main (guarding the default branch) and on
# release tags.
#
# A thin LSP client has very little runtime behaviour to test — so
# this is lint-only. luacheck catches typos, undefined globals, and
# unused locals that would otherwise surface as silent no-ops at
# runtime.

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        # Globals listed match the Neovim runtime + standard
        # plugin idioms. `vim` is the entry point to the editor
        # API; the rest are common script-level conveniences.
        run: |
          luacheck lua/ plugin/ \
            --globals vim \
            --no-max-line-length \
            --codes
